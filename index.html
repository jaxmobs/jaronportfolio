<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Jaron Mobley — Videographer | Palmer, Alaska</title>
    <meta name="description" content="Freelance videographer making mini-documentaries and brand films for small teams. Based in Palmer, Alaska." />
    <meta name="author" content="Jaron Mobley" />
    <meta name="theme-color" content="#F4F1EB" />
    <link rel="canonical" href="https://jaronmobley.com/" />

    <!-- The typeface is self-hosted, so it is preloaded directly rather than
         waiting to be discovered in the stylesheet React injects at runtime.
         Only the two faces that carry body copy — the rest can arrive late. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/ebgaramond-400.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/ebgaramond-400-italic.woff2" crossorigin />

    <!-- Open Graph (Facebook, LinkedIn, iMessage previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://jaronmobley.com/" />
    <meta property="og:title" content="Jaron Mobley — Videographer | Palmer, Alaska" />
    <meta property="og:description" content="Mini-documentaries and brand films, made close to the people in them. Based in Palmer, Alaska." />
    <meta property="og:image" content="https://jaronmobley.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Jaron Mobley" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Jaron Mobley — Videographer | Palmer, Alaska" />
    <meta name="twitter:description" content="Mini-documentaries and brand films, made close to the people in them." />
    <meta name="twitter:image" content="https://jaronmobley.com/og-image.jpg" />

    <!-- Structured Data: Person -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Jaron Mobley",
      "jobTitle": "Videographer",
      "url": "https://jaronmobley.com",
      "email": "jaronmobley@gmail.com",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Palmer",
        "addressRegion": "AK",
        "addressCountry": "US"
      },
      "sameAs": [
        "https://instagram.com/jaronmobley.mp4"
      ]
    }
    </script>

    <!-- Structured Data: LocalBusiness -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "name": "Jaron Mobley Videography",
      "description": "Freelance videographer making mini-documentaries and brand films for small teams. Shoots and edits solo.",
      "url": "https://jaronmobley.com",
      "email": "jaronmobley@gmail.com",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Palmer",
        "addressRegion": "AK",
        "addressCountry": "US"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": 61.5996,
        "longitude": -149.1200
      },
      "areaServed": {
        "@type": "State",
        "name": "Alaska"
      },
      "sameAs": [
        "https://instagram.com/jaronmobley.mp4"
      ]
    }
    </script>
  </head>
  <body style="margin:0;background:#F4F1EB;">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
